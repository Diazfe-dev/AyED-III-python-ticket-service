[project]
name = "ticket-service"
version = "0.1.0"
description = "Support ticket management system (Algoritmos III final project)."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, N: pep8-naming, B: bugbear, UP: pyupgrade, T20: no print()
select = ["E", "W", "F", "I", "N", "B", "UP", "T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
